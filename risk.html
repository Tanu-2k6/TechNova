<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Risk Assessment - TechNova</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page">

<nav>
    <h2>TechNova</h2>

    <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <button onclick="logout()">Logout</button>
    </div>
</nav>

<main class="dashboard">

    <h1>📊 Risk Assessment</h1>

    <p class="subtitle">
        Understand your investment risk profile.
    </p>

    <section class="risk-section">

        <h2>Investment Risk Assessment</h2>

        <p>How long do you plan to invest?</p>

        <label>
            <input type="radio" name="investmentDuration" value="1">
            Less than 1 year
        </label>

        <label>
            <input type="radio" name="investmentDuration" value="2">
            1–3 years
        </label>

        <label>
            <input type="radio" name="investmentDuration" value="3">
            3–5 years
        </label>

        <label>
            <input type="radio" name="investmentDuration" value="4">
            More than 5 years
        </label>

        <br>

        <p>
            How comfortable are you with temporary investment losses?
        </p>

        <label>
            <input type="radio" name="lossComfort" value="1">
            Very uncomfortable
        </label>

        <label>
            <input type="radio" name="lossComfort" value="2">
            Slightly uncomfortable
        </label>

        <label>
            <input type="radio" name="lossComfort" value="3">
            Comfortable
        </label>

        <label>
            <input type="radio" name="lossComfort" value="4">
            Very comfortable
        </label>

        <br>

        <button onclick="calculateRisk()">
            Calculate My Risk Profile
        </button>

        <h3 id="riskResult">
            Your Risk Profile: Not calculated
        </h3>

    </section>
<button class="back-button" onclick="window.location.href='dashboard.html'">Back</button>
</main>

<script src="script.js"></script>

</body>
</html>
